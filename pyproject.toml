
[project]
name = "cardio-detect-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
]

[tool.vercel]
entrypoint = "api:app"

[tool.vercel.fastapi.static]
cdn = false
